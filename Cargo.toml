[package]
name = "vinerylab"
version = "0.1.0"
edition = "2024"

[lib]
name = "vinerylab"
# `cdylib` is what Python imports (the compiled extension module);
# `rlib` is what our own `[[bin]]` and `cargo test` link against.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vinerylab"
path = "src/main.rs"

[dependencies]
bevy = {version = "0.19.1", features = ["bevy_feathers", "ghost_nodes", "bevy_ui_debug"]}
openusd = { git = "https://github.com/mxpv/openusd", rev = "7934d9f3a375fabc93c14dc96b7900cbd035204d", features = [
    "geom",
    "shade",
] }
usd_bevy = { path = "../bevy_openusd/crates/usd_bevy" }
anyhow = "1"
pyo3 = { version = "0.29", features = ["abi3-py312"], optional = true }
curvo = "0.1.91"
# Must track the version curvo builds its own points/curves with, since its
# API takes and returns nalgebra types.
nalgebra = "0.35"
bevy_panorbit_camera = "0.35.0"
spade = "2.15.1"
# Only the geometry front-end is wanted: default features pull in text
# shaping and a system font database, and an outline has no text in it.
usvg = { version = "0.48.1", default-features = false }

[features]
# Compiles the PyO3 wrapper code (src/python.rs). Safe to enable for normal
# `cargo build`/`cargo test`, since it still links against a real libpython.
python = ["dep:pyo3"]
# What maturin actually builds with: on top of `python`, this also tells
# PyO3 to *not* link libpython — the interpreter that loads the .so already
# provides those symbols. This flag breaks `cargo run`/`cargo test`, which
# is why it's kept out of the default feature set.
extension-module = ["python", "pyo3/extension-module"]

# `openusd`'s crate-file writer emits `TfTokenVector` fields (primChildren,
# propertyChildren, xformOpOrder) as `VtArray<TfToken>`, which Pixar USD
# refuses to open. Patched rather than pointed at a fork by URL: `usd_bevy`
# depends on the same git source, and a different URL would resolve to a
# second, incompatible `openusd` crate in the graph. `[patch]` rewrites the
# source for every dependent at once. Only honoured in the workspace root.
[patch."https://github.com/mxpv/openusd"]
openusd = { path = "../openusd" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
