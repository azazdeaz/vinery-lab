[package]
name = "vinerylab"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Andras Polgar <azazdeaz@gmail.com>"]

[lib]
name = "vinerylab"
# `cdylib` is what Python imports (the compiled extension module);
# `rlib` is what our own `[[bin]]` and `cargo test` link against.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vinerylab"
path = "src/main.rs"

[dependencies]
bevy = {version = "0.19.1", features = ["bevy_feathers", "ghost_nodes", "bevy_ui_debug"]}
anyhow = "1"
# The export document crosses into Python as JSON — see `src/scene/doc.rs`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.29", features = ["abi3-py312"], optional = true }
curvo = "0.1.91"
# Must track the version curvo builds its own points/curves with, since its
# API takes and returns nalgebra types.
nalgebra = "0.35"
bevy_panorbit_camera = "0.35.0"
spade = "2.15.1"
# Only the geometry front-end is wanted: default features pull in text
# shaping and a system font database, and an outline has no text in it.
usvg = { version = "0.48.1", default-features = false }

[features]
# Compiles the PyO3 wrapper code (src/python.rs). Safe to enable for normal
# `cargo build`/`cargo test`, since it still links against a real libpython.
python = ["dep:pyo3"]
# What maturin actually builds with: on top of `python`, this also tells
# PyO3 to *not* link libpython — the interpreter that loads the .so already
# provides those symbols. This flag breaks `cargo run`/`cargo test`, which
# is why it's kept out of the default feature set.
extension-module = ["python", "pyo3/extension-module"]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Web build only. Cargo unions features across target-specific and plain
# dependency entries, so `webgpu` below lands on wasm and nowhere else.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL2 has no compute shaders, so it gets none of the GPU preprocessing this
# scene's mesh count wants; `webgpu` takes precedence over the default `webgl2`
# on wasm. The backend is chosen at compile time, so one build serves one set of
# browsers — Chrome, Edge, a recent Firefox, Safari 26+.
bevy = { version = "0.19.1", features = ["webgpu"] }
# `getrandom` reaches wasm32-unknown-unknown twice — 0.4 under bevy_math's rand,
# 0.3 under curvo's argmin — and neither picks a backend on its own. Renamed
# because two majors of one crate cannot share a key. See `.cargo/config.toml`
# for the other half.
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# What the web build ships. Plain `--release` is 123 MB, half of it the `name`
# section; this is 40 MB, 12 MB over the wire.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
