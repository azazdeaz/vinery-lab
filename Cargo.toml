[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Andras Polgar <azazdeaz@gmail.com>"]

# Pinned once, here, so both crates build against the same Bevy.
[workspace.dependencies]
# `reflect_documentation` keeps the params structs' doc comments readable at
# run time, which is where the viewer's tooltips and the generated Python docs
# come from.
bevy = { version = "0.19.1", features = [
    "bevy_feathers",
    "ghost_nodes",
    "bevy_ui_debug",
    "reflect_documentation",
    # Without this, `Clipboard` on desktop writes to an in-process buffer no
    # other application can see; the web build reaches `navigator.clipboard`
    # either way.
    "system_clipboard",
] }
anyhow = "1"
# The export document crosses into Python as JSON — see
# `crates/misina-lab/src/scene/doc.rs`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
curvo = "0.1.91"
# Must track the version curvo builds its own points/curves with, since its
# API takes and returns nalgebra types.
nalgebra = "0.35"
spade = "2.15.1"
# Only the geometry front-end is wanted: default features pull in text
# shaping and a system font database, and an outline has no text in it.
usvg = { version = "0.48.1", default-features = false }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# What the web build ships. Plain `--release` is 123 MB, half of it the `name`
# section; this is 40 MB, 12 MB over the wire.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
