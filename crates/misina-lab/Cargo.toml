[package]
name = "misina-lab"
description = "What a procedural scene generator is built from."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bevy = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pyo3 = { version = "0.29", features = ["abi3-py312"], optional = true }
curvo = { workspace = true }
nalgebra = { workspace = true }
spade = { workspace = true }
usvg = { workspace = true }
bevy_panorbit_camera = "0.35.0"

[features]
# The Python side of the `generator!` macro and the glue under it
# (src/python.rs). A generator's own `python` feature enables this one.
python = ["dep:pyo3"]
