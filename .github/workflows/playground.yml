name: Playground

# Manual only: a fat-LTO wasm build of Bevy takes ~15 minutes, and a demo page
# does not have to track every push.
on: workflow_dispatch

# What `deploy-pages` needs, on top of Pages' source being set to
# "GitHub Actions" in the repository settings.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # One job: the deploy step takes seconds, so splitting it would only matter
  # under an environment protection rule.
  playground:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Its own cache: ci.yml builds a different target with a different
      # profile, so sharing one would have them evict each other.
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # Has to be the version Cargo.lock resolved. A mismatch between the CLI
      # and the shims compiled into the module fails at page load, not here.
      - name: Read the locked wasm-bindgen version
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock \
                | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "wasm-bindgen $v"
          echo "WASM_BINDGEN=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN }}

      # No apt packages: alsa, udev and wayland are all native-only paths.
      - run: cargo build --profile wasm-release --target wasm32-unknown-unknown --bin vinerylab

      - name: Bundle the site
        run: |
          mkdir -p site
          cp web/index.html site/
          wasm-bindgen --target web --no-typescript --out-dir site \
            target/wasm32-unknown-unknown/wasm-release/vinerylab.wasm
          ls -lh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
