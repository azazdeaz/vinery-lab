[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "vinerylab"
description = "Procedural vineyard scene generation, authored to USD."
requires-python = ">=3.12"
dynamic = ["version"]

[tool.maturin]
features = ["extension-module"]
module-name = "vinerylab._core"
python-source = "python"
