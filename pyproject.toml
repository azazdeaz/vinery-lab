[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "vinerylab"
description = "Procedural vineyard scene generation, authored to USD."
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
authors = [{ name = "Andras Polgar", email = "azazdeaz@gmail.com" }]
dynamic = ["version"]
# The generator builds the scene in Bevy and hands it over as JSON; the USD
# stage itself is authored here, in `vinerylab.usd`.
dependencies = ["usd-core>=24.11"]

[tool.maturin]
features = ["extension-module"]
module-name = "vinerylab._core"
python-source = "python"

[dependency-groups]
dev = ["pytest", "ruff~=0.14.0", "mypy~=1.18"]

[tool.ruff]
# rustfmt's width, so one number covers both halves of the repo.
line-length = 100

[tool.ruff.lint]
# On top of the defaults (E4, E7, E9, F): import sorting and pyupgrade.
extend-select = ["I", "UP"]

[tool.ruff.lint.isort]
# `vinerylab` is installed into the environment, so ruff would otherwise file
# the package's own imports under third-party.
known-first-party = ["vinerylab"]

[tool.ruff.lint.per-file-ignores]
# The demo mirrors Isaac Lab's own example layout, which groups imports by
# subsystem rather than by isort's rules.
"examples/isaaclab_demo/*" = ["I001"]

[tool.mypy]
files = ["python/vinerylab"]
# Isaac Lab cannot be imported without the whole simulator stack installed.
exclude = "python/vinerylab/isaaclab"

[[tool.mypy.overrides]]
module = "pxr.*"
ignore_missing_imports = true
